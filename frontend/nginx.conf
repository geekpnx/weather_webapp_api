server {
    listen 80;
    server_name 141.147.30.217;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: only if static/media is served from Django
    location /static/ {
        proxy_pass http://host.docker.internal:8022/static/;
    }

    location /media/ {
        proxy_pass http://host.docker.internal:8022/media/;
    }

    # 🔥 Forward API requests to Django backend via host
    location /api/ {
        proxy_pass http://host.docker.internal:8022/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

