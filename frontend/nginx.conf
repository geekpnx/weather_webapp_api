server {
    listen 80;
    server_name weather.trncthll.com;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Serve the frontend app (Vite handles routing with history mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve static files (from Docker volume mounted to /usr/share/nginx/html/static)
    location /static/ {
        alias /usr/share/nginx/html/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Serve uploaded media files (from /media volume)
    location /media/ {
        alias /media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Proxy API requests to Django backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Handle favicon or error pages
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
